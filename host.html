<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Host - Trò Chơi: Cùng Chung Tay Bảo Vệ Rừng Xanh</title>
<!-- Thư viện kết nối trực tiếp PeerJS & Tạo mã QR -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body { background: linear-gradient(180deg, #70c5ff 0%, #d4f0ff 45%, #bce6ab 100%); min-height: 100vh; color: #1c2833; overflow-x: hidden; }
  
  header { background: #1b5e20; color: white; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
  header h1 { font-size: 1.35rem; }
  .btn-start { background: #e91e63; color: white; border: none; padding: 10px 24px; border-radius: 25px; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
  .btn-start:hover { transform: scale(1.05); background: #c2185b; }
  .btn-reset { background: #f57c00; color: white; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; margin-left: 10px; }

  /* SẢNH CHỜ (LOBBY) */
  #lobbyScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 20px; text-align: center; }
  .qr-card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); margin-bottom: 20px; }
  #qrcode { margin: 15px auto; display: inline-block; }
  .room-id-box { font-size: 1.25rem; font-weight: bold; color: #d81b60; margin: 10px 0; }
  .player-count { font-size: 1.3rem; font-weight: bold; color: #1b5e20; margin-bottom: 15px; }
  .players-grid { display: flex; flex-wrap: wrap; gap: 10px; max-width: 900px; justify-content: center; }
  .player-tag { background: white; padding: 8px 16px; border-radius: 20px; font-weight: bold; box-shadow: 0 3px 6px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 6px; font-size: 1rem; border-left: 5px solid #2e7d32; }

  /* MÀN HÌNH GAME CHÍNH: CỘT CÂU HỎI MỞ RỘNG ĐỂ CHỮ TO HƠN */
  #gameScreen { display: none; grid-template-columns: 260px 1fr 420px; gap: 15px; padding: 15px; height: calc(100vh - 65px); }
  .panel { background: rgba(255, 255, 255, 0.96); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); overflow-y: auto; }
  
  /* NÚI 3D HÌNH CHÓP */
  .mountain-viewport { position: relative; background: linear-gradient(180deg, #b3e5fc 0%, #e1f5fe 65%, #c8e6c9 100%); border-radius: 20px; display: flex; justify-content: center; align-items: flex-end; overflow: hidden; box-shadow: inset 0 0 30px rgba(0,0,0,0.1); }
  #mountainSvg { width: 100%; height: 95%; max-height: 720px; }
  .tier-path { fill: #8D6E63; stroke: #5D4037; stroke-width: 2; transition: fill 0.8s ease; }
  .tier-path.green { fill: #43A047 !important; stroke: #2E7D32 !important; }
  .tier-path.summit-green { fill: #2E7D32 !important; stroke: #FFD700 !important; }

  /* KHUNG CÂU HỎI & ĐỒNG HỒ 30S ĐÃ TĂNG CỠ CHỮ */
  .timer-box { font-size: 2rem; font-weight: 800; color: #d32f2f; text-align: center; background: #ffebee; border-radius: 12px; padding: 8px; letter-spacing: 1px; box-shadow: 0 2px 6px rgba(211,47,47,0.15); }
  .q-badge { background: #2e7d32; color: white; padding: 5px 14px; border-radius: 12px; font-size: 0.95rem; font-weight: bold; width: fit-content; }
  
  /* CHỮ CÂU HỎI LỚN RÕ NÉT */
  .q-text { font-size: 1.35rem; font-weight: 800; color: #1b5e20; line-height: 1.5; background: #f1f8e9; padding: 14px; border-radius: 12px; border-left: 6px solid #2e7d32; }
  
  /* CỠ CHỮ CÁC Ô ĐÁP ÁN TO HƠN */
  .ans-option { padding: 12px 16px; border-radius: 10px; font-size: 1.05rem; font-weight: 600; color: white; margin-bottom: 8px; line-height: 1.4; box-shadow: 0 3px 6px rgba(0,0,0,0.1); }
  .opt-0 { background: #e53935; }
  .opt-1 { background: #1e88e5; }
  .opt-2 { background: #fbc02d; color: #111; }
  .opt-3 { background: #43a047; }
  .ans-option.correct-highlight { outline: 5px solid #ffd700; transform: scale(1.02); }
  .round-log { font-size: 0.95rem; font-weight: bold; color: #2e7d32; margin-top: auto; padding: 10px; background: #e8f5e9; border-radius: 10px; border: 1px solid #c8e6c9; }
</style>
</head>
<body>

<header>
  <h1>🌲 Trò Chơi: Cùng Chung Tay Bảo Vệ Rừng Xanh</h1>
  <div>
    <button class="btn-start" id="startBtn" onclick="startGame()">🚀 BẮT ĐẦU CHƠI</button>
    <button class="btn-reset" onclick="location.reload()">🔄 Đặt lại</button>
  </div>
</header>

<!-- SẢNH CHỜ KẾT NỐI -->
<div id="lobbyScreen">
  <div class="qr-card">
    <h2 style="color: #1b5e20;">Quét mã QR bằng điện thoại để tham gia:</h2>
    <div id="qrcode"></div>
    <div class="room-id-box" id="roomCodeDisplay">MÃ PHÒNG: Đang kết nối...</div>
    <p id="playerUrl" style="color: #666; font-size: 0.85rem; word-break: break-all;"></p>
  </div>
  <div class="player-count">Số đội đã tham gia: <span id="connectedCount">0</span></div>
  <div class="players-grid" id="lobbyPlayers"></div>
</div>

<!-- MÀN HÌNH THI ĐẤU -->
<div id="gameScreen">
  <div class="panel">
    <h3 style="color: #1b5e20; font-size: 1.05rem;">🏆 Tiến Độ Trồng Cây</h3>
    <div id="leaderboard" style="display: flex; flex-direction: column; gap: 6px;"></div>
  </div>

  <div class="mountain-viewport">
    <svg id="mountainSvg" viewBox="0 0 700 650" preserveAspectRatio="xMidYMid meet">
      <defs>
        <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff9c4"/>
          <stop offset="100%" stop-color="transparent"/>
        </radialGradient>
      </defs>
      <circle cx="350" cy="80" r="120" fill="url(#sunGlow)"/>
      <circle cx="350" cy="80" r="35" fill="#fbc02d"/>

      <path id="tier-0" class="tier-path" d="M 50,600 L 650,600 L 610,540 L 90,540 Z" />
      <path id="tier-1" class="tier-path" d="M 90,540 L 610,540 L 575,480 L 125,480 Z" />
      <path id="tier-2" class="tier-path" d="M 125,480 L 575,480 L 540,420 L 160,420 Z" />
      <path id="tier-3" class="tier-path" d="M 160,420 L 540,420 L 505,360 L 195,360 Z" />
      <path id="tier-4" class="tier-path" d="M 195,360 L 505,360 L 470,300 L 230,300 Z" />
      <path id="tier-5" class="tier-path" d="M 230,300 L 470,300 L 435,240 L 265,240 Z" />
      <path id="tier-6" class="tier-path" d="M 265,240 L 435,240 L 400,180 L 300,180 Z" />
      <path id="tier-7" class="tier-path" d="M 300,180 L 400,180 L 375,120 L 325,120 Z" />
      <polygon id="tier-8" class="tier-path" points="350,60 325,120 375,120" />

      <g transform="translate(250, 20)">
        <rect width="200" height="32" rx="16" fill="#ffd700" stroke="#b71c1c" stroke-width="2"/>
        <text x="100" y="22" text-anchor="middle" fill="#b71c1c" font-size="13" font-weight="bold">🏆 ĐỈNH RÙNG XANH</text>
      </g>
      <g id="treesLayer"></g>
    </svg>
  </div>

  <div class="panel">
    <div class="timer-box" id="timerBox">⏱️ 30s</div>
    <div class="q-badge" id="qBadge">Câu 1 / 8</div>
    <div class="q-text" id="qText">Nội dung câu hỏi...</div>
    <div id="ansBox"></div>
    <div class="round-log" id="roundFeedback">Học sinh quan sát câu hỏi và bấm đáp án trên điện thoại!</div>
  </div>
</div>

<script>
  const roomId = 'room_' + Math.floor(1000 + Math.random() * 9000);
  const peer = new Peer(roomId);

  let connections = {};
  let players = {};
  let currentAnswers = {};
  let curQIndex = 0;
  let timerInterval = null;
  let timeLeft = 30; // CÀI ĐẶT THỜI GIAN 30 GIÂY
  const tierYPositions = [570, 510, 450, 390, 330, 270, 210, 150, 95];

  peer.on('open', (id) => {
    document.getElementById('roomCodeDisplay').textContent = "MÃ PHÒNG: " + id.replace('room_', '');
    const baseUrl = window.location.href.split('host.html')[0] + 'play.html';
    const finalPlayUrl = baseUrl + '?room=' + id;
    document.getElementById('playerUrl').textContent = finalPlayUrl;
    
    document.getElementById('qrcode').innerHTML = '';
    new QRCode(document.getElementById("qrcode"), { text: finalPlayUrl, width: 145, height: 145 });
  });

  peer.on('connection', (conn) => {
    conn.on('data', (data) => {
      if (data.type === 'join') {
        connections[conn.peer] = conn;
        players[conn.peer] = {
          id: conn.peer,
          name: data.name,
          icon: data.icon,
          color: data.color,
          step: 0
        };
        updateLobby();
        renderMountainAndBoard();
      } else if (data.type === 'answer') {
        currentAnswers[conn.peer] = data;
      }
    });
  });

  function updateLobby() {
    const keys = Object.keys(players);
    document.getElementById('connectedCount').textContent = keys.length;
    const lobbyDiv = document.getElementById('lobbyPlayers');
    lobbyDiv.innerHTML = '';
    keys.forEach(k => {
      const p = players[k];
      lobbyDiv.innerHTML += `<div class="player-tag">${p.icon} ${p.name}</div>`;
    });
  }

  // 8 CÂU HỎI TRẮC NGHIỆM TỪ TỆP CÔNG NGHỆ (LÂM NGHIỆP)
  const questions = [
    { 
      q: "Việc tổ chức tuyên truyền về vai trò, giá trị của rừng thuộc biện pháp bảo vệ tài nguyên rừng nào sau đây?", 
      opts: [
        "Trồng cây", 
        "Nâng cao ý thức bảo vệ rừng", 
        "Phòng chống cháy rừng", 
        "Xây dựng các khu bảo tồn thiên nhiên"
      ], 
      ans: 1 
    },
    { 
      q: "Vì sao trồng rừng, trồng cây xanh ở đô thị và nông thôn góp phần bảo vệ tài nguyên rừng?", 
      opts: [
        "Tạo nguồn gỗ cung cấp cho nhu cầu con người, nhờ đó giảm nhu cầu khai thác gỗ từ rừng", 
        "Làm tăng lượng gỗ khai thác từ rừng tự nhiên", 
        "Giúp người dân có thêm đất để đốt nương làm rẫy", 
        "Làm giảm số lượng các khu bảo tồn thiên nhiên"
      ], 
      ans: 0 
    },
    { 
      q: "Địa điểm nào sau đây là nơi trồng cây xanh ở khu vực nông thôn?", 
      opts: [
        "Công viên, vườn hoa", 
        "Vỉa hè đường phố", 
        "Khuôn viên trường học, bệnh viện", 
        "Ven sông, kênh, mương, hành lang giao thông"
      ], 
      ans: 3 
    },
    { 
      q: "Hành vi nào sau đây làm suy thoái tài nguyên rừng và bị nghiêm cấm?", 
      opts: [
        "Trồng rừng trên đất trống, đồi núi trọc", 
        "Tập huấn phòng cháy, chữa cháy rừng", 
        "Săn bắt thú rừng trái phép", 
        "Lắp đặt biển báo ở khu vực rừng"
      ], 
      ans: 2 
    },
    { 
      q: "Hoạt động nào sau đây KHÔNG phải là biện pháp phòng chống cháy rừng?", 
      opts: [
        "Lắp biển báo ở khu vực có nguy cơ cao cháy rừng", 
        "Đốt nương làm rẫy để lấy đất canh tác", 
        "Tập huấn cho chủ rừng và người dân về an toàn phòng cháy, chữa cháy rừng", 
        "Chủ động chuẩn bị phương tiện, dụng cụ chữa cháy rừng"
      ], 
      ans: 1 
    },
    { 
      q: "Bốn loại khu bảo tồn thiên nhiên gồm:", 
      opts: [
        "Rừng phòng hộ, rừng sản xuất, vườn quốc gia, khu dự trữ thiên nhiên", 
        "Vườn quốc gia, rừng sản xuất, khu bảo vệ cảnh quan, rừng phòng hộ", 
        "Khu dự trữ thiên nhiên, rừng đặc dụng, rừng phòng hộ, khu bảo tồn loài – sinh cảnh", 
        "Vườn quốc gia, khu dự trữ thiên nhiên, khu bảo tồn loài – sinh cảnh, khu bảo vệ cảnh quan"
      ], 
      ans: 3 
    },
    { 
      q: "Đa dạng sinh học là gì?", 
      opts: [
        "Sự phong phú về gene, loài sinh vật và hệ sinh thái trong tự nhiên", 
        "Số lượng cây gỗ có trong một khu rừng", 
        "Diện tích rừng được trồng mới hằng năm", 
        "Số lượng các khu bảo tồn thiên nhiên của một quốc gia"
      ], 
      ans: 0 
    },
    { 
      q: "Chính sách nào sau đây của Nhà nước khuyến khích người dân tham gia trồng rừng?", 
      opts: [
        "Cấm cho thuê đất để trồng rừng", 
        "Dừng đầu tư cho rừng đặc dụng và rừng phòng hộ", 
        "Miễn, giảm thuế đối với người trồng rừng", 
        "Thu hồi đất trống, đồi núi trọc của hộ gia đình"
      ], 
      ans: 2 
    }
  ];

  // HỆ THỐNG ÂM THANH
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (type === 'birds') {
      const melody = [2093, 2637, 3136, 2637, 3520, 4186, 3136, 3520];
      melody.forEach((freq, idx) => {
        setTimeout(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.16);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(); osc.stop(audioCtx.currentTime + 0.16);
        }, idx * 110);
      });
      return;
    }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if (type === 'correct') {
      osc.frequency.setValueAtTime(523, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(784, audioCtx.currentTime + 0.25);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
      osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }
  }

  function broadcast(data) {
    Object.values(connections).forEach(conn => conn.send(data));
  }

  function startGame() {
    if (Object.keys(players).length === 0) {
      alert("Chưa có đội nào tham gia! Vui lòng đợi học sinh quét mã trên điện thoại.");
      return;
    }
    document.getElementById('lobbyScreen').style.display = 'none';
    document.getElementById('gameScreen').style.display = 'grid';
    document.getElementById('startBtn').style.display = 'none';
    startQuestion(0);
  }

  function startQuestion(idx) {
    curQIndex = idx;
    if (curQIndex >= questions.length) {
      document.getElementById('qBadge').textContent = 'KẾT THÚC!';
      document.getElementById('qText').textContent = '🎉 Tất cả câu hỏi đã hoàn tất. Ngọn đồi đã được phủ xanh!';
      broadcast({ type: 'end' });
      return;
    }

    currentAnswers = {};
    const q = questions[curQIndex];
    document.getElementById('qBadge').textContent = `Câu ${curQIndex + 1} / ${questions.length}`;
    document.getElementById('qText').textContent = q.q;
    const ansBox = document.getElementById('ansBox');
    ansBox.innerHTML = '';
    q.opts.forEach((txt, i) => {
      ansBox.innerHTML += `<div class="ans-option opt-${i}" id="opt-${i}"><b>${String.fromCharCode(65+i)}.</b> ${txt}</div>`;
    });

    broadcast({ type: 'new_question', qIndex: curQIndex });

    // ĐẾM NGƯỢC CHUẨN 30 GIÂY
    timeLeft = 30;
    document.getElementById('timerBox').textContent = `⏱️ ${timeLeft}s`;
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      document.getElementById('timerBox').textContent = `⏱️ ${timeLeft}s`;
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        endRound();
      }
    }, 1000);
  }

  function endRound() {
    const curAns = questions[curQIndex].ans;
    const optEl = document.getElementById(`opt-${curAns}`);
    if (optEl) optEl.classList.add('correct-highlight');

    let correctList = [];
    Object.keys(currentAnswers).forEach(pId => {
      const a = currentAnswers[pId];
      if (a.choice === curAns && players[pId]) {
        const gain = a.isX2 ? 2 : 1;
        players[pId].step = Math.min((players[pId].step || 0) + gain, 8);
        correctList.push(players[pId].name);
      }
    });

    if (correctList.length > 0) playSound('correct');
    document.getElementById('roundFeedback').innerHTML = `Đội trả lời đúng: ${correctList.join(', ') || 'Không có đội nào'}`;
    renderMountainAndBoard();

    const winner = Object.values(players).find(p => p.step >= 8);
    if (winner) {
      playSound('birds');
      setTimeout(() => alert(`🏆 Chúc mừng ${winner.name} đã chạm đỉnh nấc 8, phủ xanh ngọn đồi!`), 500);
    }

    setTimeout(() => startQuestion(curQIndex + 1), 4000);
  }

  function renderMountainAndBoard() {
    const board = document.getElementById('leaderboard');
    board.innerHTML = '';
    const sorted = Object.values(players).sort((a,b) => (b.step || 0) - (a.step || 0));
    sorted.forEach(p => {
      board.innerHTML += `<div style="display:flex; justify-content:space-between; font-size:0.88rem; padding:5px 0; border-bottom:1px solid #eee;">
        <span>${p.icon} <b>${p.name}</b></span>
        <b style="color:#2e7d32;">Bậc ${p.step || 0}/8</b>
      </div>`;
    });

    const layer = document.getElementById('treesLayer');
    layer.innerHTML = '';
    const stepsGroup = {};
    for (let i = 0; i <= 8; i++) stepsGroup[i] = [];
    Object.values(players).forEach(p => stepsGroup[Math.min(p.step || 0, 8)].push(p));

    for (let s = 1; s <= 8; s++) {
      const path = document.getElementById(`tier-${s}`);
      const hasClimbers = Object.values(players).some(p => (p.step || 0) >= s);
      if (hasClimbers) {
        if (s === 8) path.classList.add('summit-green');
        else path.classList.add('green');
      } else {
        path.classList.remove('green', 'summit-green');
      }
    }

    for (let s = 0; s <= 8; s++) {
      const occupants = stepsGroup[s];
      if (occupants.length === 0) continue;
      const y = tierYPositions[s];
      const spanWidth = 440 * (1 - s * 0.1);
      const startX = 350 - spanWidth / 2;
      const stepDist = occupants.length > 1 ? spanWidth / (occupants.length - 1) : 0;

      occupants.forEach((p, idx) => {
        const x = occupants.length === 1 ? 350 : startX + idx * stepDist;
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("transform", `translate(${x}, ${y})`);
        g.innerHTML = `<circle r="14" fill="#fff" stroke="${p.color || '#4CAF50'}" stroke-width="2.5"/><text text-anchor="middle" dy="4" font-size="12">${p.icon}</text>`;
        layer.appendChild(g);
      });
    }
  }
</script>
</body>
 </html>
