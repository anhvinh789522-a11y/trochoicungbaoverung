<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Host - Kahoot Phủ Xanh Rừng Trọc</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body { background: linear-gradient(180deg, #70c5ff 0%, #d4f0ff 45%, #bce6ab 100%); min-height: 100vh; color: #1c2833; overflow-x: hidden; }
  
  header { background: #1b5e20; color: white; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
  .btn-start { background: #e91e63; color: white; border: none; padding: 10px 24px; border-radius: 25px; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
  .btn-start:hover { transform: scale(1.05); background: #c2185b; }
  .btn-reset { background: #f57c00; color: white; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; margin-left: 10px; }

  /* SẢNH CHỜ KẾT NỐI (LOBBY - TƯƠNG TỰ KAHOOT) */
  #lobbyScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; text-align: center; }
  .qr-card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); margin-bottom: 25px; }
  #qrcode { margin: 15px auto; display: inline-block; }
  .player-count { font-size: 1.5rem; font-weight: bold; color: #1b5e20; margin-bottom: 15px; }
  .players-grid { display: flex; flex-wrap: wrap; gap: 10px; max-width: 900px; justify-content: center; }
  .player-tag { background: white; padding: 8px 16px; border-radius: 20px; font-weight: bold; box-shadow: 0 3px 6px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 6px; font-size: 1rem; }

  /* MÀN HÌNH GAME CHÍNH */
  #gameScreen { display: none; grid-template-columns: 280px 1fr 340px; gap: 15px; padding: 15px; height: calc(100vh - 65px); }
  .panel { background: rgba(255, 255, 255, 0.95); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); overflow-y: auto; }
  
  /* NÚI SVG HÌNH CHÓP */
  .mountain-viewport { position: relative; background: linear-gradient(180deg, #b3e5fc 0%, #e1f5fe 65%, #c8e6c9 100%); border-radius: 20px; display: flex; justify-content: center; align-items: flex-end; overflow: hidden; }
  #mountainSvg { width: 100%; height: 95%; max-height: 720px; }
  .tier-path { fill: #8D6E63; stroke: #5D4037; stroke-width: 2; transition: fill 0.8s ease; }
  .tier-path.green { fill: #43A047 !important; stroke: #2E7D32 !important; }
  .tier-path.summit-green { fill: #2E7D32 !important; stroke: #FFD700 !important; }

  /* CÂU HỎI & ĐỒNG HỒ ĐẾM NGƯỢC */
  .timer-box { font-size: 1.5rem; font-weight: bold; color: #d32f2f; text-align: center; background: #ffebee; border-radius: 10px; padding: 5px; }
  .q-badge { background: #2e7d32; color: white; padding: 4px 10px; border-radius: 10px; font-size: 0.8rem; font-weight: bold; width: fit-content; }
  .q-text { font-size: 1.05rem; font-weight: bold; color: #1b5e20; line-height: 1.4; }
  .ans-option { padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; font-weight: 500; color: white; margin-bottom: 6px; }
  .opt-0 { background: #e53935; }
  .opt-1 { background: #1e88e5; }
  .opt-2 { background: #fbc02d; color: #222; }
  .opt-3 { background: #43a047; }
  .ans-option.correct-highlight { outline: 4px solid #ffd700; font-weight: bold; }
</style>
</head>
<body>

<header>
  <h1>🌲 Kahoot: Cùng Chung Tay Phủ Xanh Ngọn Đồi Trọc</h1>
  <div>
    <button class="btn-start" id="startBtn" onclick="startGame()">🚀 BẮT ĐẦU CHƠI</button>
    <button class="btn-reset" onclick="resetGame()">🔄 Đặt lại</button>
  </div>
</header>

<!-- 1. MÀN HÌNH SẢNH CHỜ (LOBBY) -->
<div id="lobbyScreen">
  <div class="qr-card">
    <h2 style="color: #1b5e20; margin-bottom: 5px;">Quét mã QR bằng điện thoại để tham gia:</h2>
    <div id="qrcode"></div>
    <p id="playerUrl" style="color: #555; font-size: 0.85rem; word-break: break-all;"></p>
  </div>
  <div class="player-count">Số đội đã tham gia: <span id="connectedCount">0</span></div>
  <div class="players-grid" id="lobbyPlayers"></div>
</div>

<!-- 2. MÀN HÌNH THI ĐẤU -->
<div id="gameScreen">
  <!-- BẢNG XẾP HẠNG TIẾN ĐỘ -->
  <div class="panel">
    <h3 style="color: #1b5e20; font-size: 1rem;">🏆 Tiến Độ Trồng Cây</h3>
    <div id="leaderboard" style="display: flex; flex-direction: column; gap: 6px;"></div>
  </div>

  <!-- NÚI 3D HÌNH CHÓP -->
  <div class="mountain-viewport">
    <svg id="mountainSvg" viewBox="0 0 700 650" preserveAspectRatio="xMidYMid meet">
      <defs>
        <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff9c4"/>
          <stop offset="100%" stop-color="transparent"/>
        </radialGradient>
      </defs>
      <circle cx="350" cy="80" r="120" fill="url(#sunGlow)"/>
      <circle cx="350" cy="80" r="35" fill="#fbc02d"/>

      <path id="tier-0" class="tier-path" d="M 50,600 L 650,600 L 610,540 L 90,540 Z" />
      <path id="tier-1" class="tier-path" d="M 90,540 L 610,540 L 575,480 L 125,480 Z" />
      <path id="tier-2" class="tier-path" d="M 125,480 L 575,480 L 540,420 L 160,420 Z" />
      <path id="tier-3" class="tier-path" d="M 160,420 L 540,420 L 505,360 L 195,360 Z" />
      <path id="tier-4" class="tier-path" d="M 195,360 L 505,360 L 470,300 L 230,300 Z" />
      <path id="tier-5" class="tier-path" d="M 230,300 L 470,300 L 435,240 L 265,240 Z" />
      <path id="tier-6" class="tier-path" d="M 265,240 L 435,240 L 400,180 L 300,180 Z" />
      <path id="tier-7" class="tier-path" d="M 300,180 L 400,180 L 375,120 L 325,120 Z" />
      <polygon id="tier-8" class="tier-path" points="350,60 325,120 375,120" />

      <g transform="translate(250, 20)">
        <rect width="200" height="32" rx="16" fill="#ffd700" stroke="#b71c1c" stroke-width="2"/>
        <text x="100" y="22" text-anchor="middle" fill="#b71c1c" font-size="13" font-weight="bold">🏆 ĐỈNH RÙNG XANH</text>
      </g>
      <g id="treesLayer"></g>
    </svg>
  </div>

  <!-- CÂU HỎI & ĐÁP ÁN -->
  <div class="panel">
    <div class="timer-box" id="timerBox">⏱️ 15s</div>
    <div class="q-badge" id="qBadge">Câu 1 / 8</div>
    <div class="q-text" id="qText">Nội dung câu hỏi...</div>
    <div id="ansBox"></div>
    <div id="roundFeedback" style="font-size: 0.85rem; font-weight: bold; color: #2e7d32; margin-top: auto;"></div>
  </div>
</div>

<script>
  // CẤU HÌNH FIREBASE
  const firebaseConfig = {
    apiKey: "AIzaSyCfRfGLxG48b8Cgj6PUCFNrrhpgjmn4i2A",
    authDomain: "vuihoccungcon-ac879.firebaseapp.com",
    databaseURL: "https://vuihoccungcon-ac879-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "vuihoccungcon-ac879",
    storageBucket: "vuihoccungcon-ac879.firebasestorage.app",
    messagingSenderId: "48463907829",
    appId: "1:48463907829:web:d7f208b4e4b7b64aaeeebc"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const playUrl = window.location.href.replace("host.html", "play.html");
  document.getElementById("playerUrl").textContent = playUrl;
  new QRCode(document.getElementById("qrcode"), { text: playUrl, width: 140, height: 140 });

  let players = {};
  let curQIndex = 0;
  let timerInterval = null;
  let timeLeft = 15;
  const tierYPositions = [570, 510, 450, 390, 330, 270, 210, 150, 95];

  const questions = [
    { q: "Vai trò nào sau đây KHÔNG PHẢI là lợi ích của rừng nhiệt đới?", opts: ["Chống sạt lở lũ quét", "Hấp thụ CO2 & tạo Oxy", "Làm tăng hiệu ứng nhà kính", "Bảo tồn đa dạng sinh học"], ans: 2 },
    { q: "Rừng mưa nhiệt đới thường phân bố thành mấy tầng tán chính?", opts: ["2 tầng", "3 tầng", "4 - 5 tầng", "Chỉ 1 tầng"], ans: 2 },
    { q: "Đâu là loài cây gỗ quý đặc trưng của rừng nhiệt đới Đông Nam Á?", opts: ["Cây Bạch dương", "Cây Gõ đỏ", "Xương rồng sa mạc", "Thông tuyết"], ans: 1 },
    { q: "Hiện tượng nguy hiểm nào xảy ra khi đồi núi bị tàn phá trơ trọi đất đá?", opts: ["Hạn hán kéo dài", "Lũ quét và sạt lở đất đá", "Đất chua hóa", "Bão cát"], ans: 1 },
    { q: "Biện pháp phục hồi đồi núi trọc bền vững nhất là gì?", opts: ["Trồng xen cây bản địa đa loài", "Đốt sạch cỏ dại", "Chỉ trồng 1 loại cây duy nhất", "Đào xới toàn bộ đồi"], ans: 0 },
    { q: "Rừng phòng hộ có nhiệm vụ cốt lõi nào sau đây?", opts: ["Khai thác gỗ tối đa", "Chắn gió, giữ nước, chống xói mòn", "Chăn thả gia súc", "Xây dựng nhà máy xưởng"], ans: 1 },
    { q: "Hành động nào của học sinh góp phần bảo vệ tài nguyên rừng?", opts: ["Tiết kiệm giấy vở", "Nói không với thú rừng", "Tích cực trồng cây xanh", "Tất cả các ý trên"], ans: 3 },
    { q: "Ngày Quốc tế về Rừng được kỷ niệm vào ngày nào hằng năm?", opts: ["21 tháng 3", "22 tháng 4", "05 tháng 6", "19 tháng 8"], ans: 0 }
  ];

  // ÂM THANH
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (type === 'birds') {
      const melody = [2093, 2637, 3136, 2637, 3520, 4186, 3136, 3520];
      melody.forEach((freq, idx) => {
        setTimeout(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.16);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(); osc.stop(audioCtx.currentTime + 0.16);
        }, idx * 110);
      });
      return;
    }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if (type === 'correct') {
      osc.frequency.setValueAtTime(523, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(784, audioCtx.currentTime + 0.25);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
      osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }
  }

  // LẮNG NGHE ĐỘI THAM GIA PHÒNG CHỜ
  db.ref('players').on('value', (snapshot) => {
    players = snapshot.val() || {};
    const keys = Object.keys(players);
    document.getElementById('connectedCount').textContent = keys.length;
    
    const lobbyDiv = document.getElementById('lobbyPlayers');
    lobbyDiv.innerHTML = '';
    keys.forEach(k => {
      const p = players[k];
      lobbyDiv.innerHTML += `<div class="player-tag">${p.icon} ${p.name}</div>`;
    });
    renderMountainAndBoard();
  });

  // GIÁO VIÊN BẤM NÚT BẮT ĐẦU CHƠI
  function startGame() {
    if (Object.keys(players).length === 0) {
      alert("Chưa có đội nào tham gia! Hãy đợi học sinh quét mã.");
      return;
    }
    document.getElementById('lobbyScreen').style.display = 'none';
    document.getElementById('gameScreen').style.display = 'grid';
    document.getElementById('startBtn').style.display = 'none';
    
    // Gửi thông báo bắt đầu lên Firebase
    db.ref('gameState').set({ status: 'playing', currentQuestion: 0 });
    startQuestion(0);
  }

  function startQuestion(qIndex) {
    curQIndex = qIndex;
    if (curQIndex >= questions.length) {
      endGame();
      return;
    }
    db.ref('gameState').update({ currentQuestion: curQIndex });
    db.ref('answers').remove();

    const q = questions[curQIndex];
    document.getElementById('qBadge').textContent = `Câu ${curQIndex + 1} / ${questions.length}`;
    document.getElementById('qText').textContent = q.q;
    const ansBox = document.getElementById('ansBox');
    ansBox.innerHTML = '';
    q.opts.forEach((txt, idx) => {
      ansBox.innerHTML += `<div class="ans-option opt-${idx}" id="opt-${idx}"><b>${String.fromCharCode(65+idx)}.</b> ${txt}</div>`;
    });

    timeLeft = 15;
    document.getElementById('timerBox').textContent = `⏱️ ${timeLeft}s`;
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      document.getElementById('timerBox').textContent = `⏱️ ${timeLeft}s`;
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        endRound();
      }
    }, 1000);
  }

  // KẾT THÚC HẾT GIỜ CÂU HỎI & TÍNH ĐIỂM TIẾN BẬC
  function endRound() {
    const curAns = questions[curQIndex].ans;
    const optEl = document.getElementById(`opt-${curAns}`);
    if (optEl) optEl.classList.add('correct-highlight');

    db.ref('answers').once('value', (snapshot) => {
      const answers = snapshot.val() || {};
      let correctTeams = [];

      Object.keys(answers).forEach(pId => {
        const ansData = answers[pId];
        if (ansData.choice === curAns && players[pId]) {
          const gain = ansData.isX2 ? 2 : 1;
          players[pId].step = Math.min((players[pId].step || 0) + gain, 8);
          db.ref(`players/${pId}/step`).set(players[pId].step);
          correctTeams.push(players[pId].name);
        }
      });

      if (correctTeams.length > 0) playSound('correct');
      document.getElementById('roundFeedback').innerHTML = `Đội trả lời đúng: ${correctTeams.join(', ') || 'Không có đội nào'}`;
      renderMountainAndBoard();

      // Kiểm tra có đội nào chạm đỉnh 8 nấc chưa
      const winner = Object.values(players).find(p => p.step >= 8);
      if (winner) {
        playSound('birds');
        setTimeout(() => alert(`🏆 Chúc mừng ${winner.name} đã chạm đỉnh phủ xanh ngọn đồi!`), 500);
      }

      setTimeout(() => {
        startQuestion(curQIndex + 1);
      }, 4000);
    });
  }

  function renderMountainAndBoard() {
    const board = document.getElementById('leaderboard');
    if (!board) return;
    board.innerHTML = '';
    
    const sorted = Object.values(players).sort((a,b) => (b.step || 0) - (a.step || 0));
    sorted.forEach(p => {
      board.innerHTML += `<div style="display:flex; justify-content:space-between; font-size:0.85rem; padding:4px 0; border-bottom:1px solid #eee;">
        <span>${p.icon} <b>${p.name}</b></span>
        <b style="color:#2e7d32;">Bậc ${p.step || 0}/8</b>
      </div>`;
    });

    // Vẽ cây lên nấc thang núi chóp
    const layer = document.getElementById('treesLayer');
    if (!layer) return;
    layer.innerHTML = '';
    const stepsGroup = {};
    for (let i = 0; i <= 8; i++) stepsGroup[i] = [];
    Object.values(players).forEach(p => stepsGroup[Math.min(p.step || 0, 8)].push(p));

    for (let s = 1; s <= 8; s++) {
      const path = document.getElementById(`tier-${s}`);
      const hasClimbers = Object.values(players).some(p => (p.step || 0) >= s);
      if (hasClimbers) {
        if (s === 8) path.classList.add('summit-green');
        else path.classList.add('green');
      } else {
        path.classList.remove('green', 'summit-green');
      }
    }

    for (let s = 0; s <= 8; s++) {
      const occupants = stepsGroup[s];
      if (occupants.length === 0) continue;
      const y = tierYPositions[s];
      const spanWidth = 440 * (1 - s * 0.1);
      const startX = 350 - spanWidth / 2;
      const stepDist = occupants.length > 1 ? spanWidth / (occupants.length - 1) : 0;

      occupants.forEach((p, idx) => {
        const x = occupants.length === 1 ? 350 : startX + idx * stepDist;
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("transform", `translate(${x}, ${y})`);
        g.innerHTML = `<circle r="14" fill="#fff" stroke="${p.color || '#4CAF50'}" stroke-width="2.5"/><text text-anchor="middle" dy="4" font-size="12">${p.icon}</text>`;
        layer.appendChild(g);
      });
    }
  }

  function endGame() {
    clearInterval(timerInterval);
    document.getElementById('qBadge').textContent = 'KẾT THÚC!';
    document.getElementById('qText').textContent = '🎉 Tất cả câu hỏi đã hoàn tất. Ngọn đồi đã được phủ xanh!';
  }

  function resetGame() {
    db.ref().remove();
    location.reload();
  }
</script>
</body>
        </html>
