<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Học Sinh: Điều Khiển Trồng Rừng</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: #e8f5e9; padding: 15px; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; }
  
  #joinCard { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin: auto; width: 100%; max-width: 360px; text-align: center; }
  #joinCard h2 { color: #1b5e20; margin-bottom: 12px; }
  input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #81c784; font-size: 1rem; margin-bottom: 12px; }
  .btn-join { width: 100%; padding: 12px; background: #2e7d32; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }

  #playScreen { display: none; flex-direction: column; height: 100%; justify-content: space-between; }
  .team-bar { background: white; padding: 8px 12px; border-radius: 10px; font-weight: bold; color: #1b5e20; text-align: center; }
  .btn-x2 { background: #fff; border: 2px dashed #ff9800; color: #e65100; font-weight: bold; padding: 10px; border-radius: 20px; font-size: 0.95rem; margin: 6px 0; }
  .btn-x2.active { background: #ff9800; color: white; }

  .pad-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; flex: 1; margin: 8px 0; }
  .pad-btn { border: none; border-radius: 16px; font-size: 2.2rem; font-weight: bold; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .pad-btn:active { transform: scale(0.95); }
  .btn-a { background: #e53935; }
  .btn-b { background: #1e88e5; }
  .btn-c { background: #fbc02d; color: #222; }
  .btn-d { background: #43a047; }
  .status-text { text-align: center; font-size: 0.85rem; color: #555; }
</style>
</head>
<body>

<!-- MÀN HÌNH NHẬP TÊN -->
<div id="joinCard">
  <h2>🌲 Vào Đội Trồng Rừng</h2>
  <input type="text" id="pName" placeholder="Nhập tên Đội / Tên Bạn..." maxlength="15">
  <select id="pTree">
    <option value="🌴|#8BC34A">🌴 Cây Cọ Nhiệt Đới</option>
    <option value="🌾|#FFD54F">🌾 Cây Keo Lá Tràm</option>
    <option value="🌳|#2E7D32">🌳 Cây Gõ Đỏ</option>
    <option value="🎋|#4DB6AC">🎋 Tre Gai / Trúc</option>
    <option value="🍂|#FFB74D">🍂 Cây Giáng Hương</option>
    <option value="🌲|#1B5E20">🌲 Cây Sao Đen</option>
    <option value="🌱|#8D6E63">🌱 Cây Đước Đỏ</option>
    <option value="🌺|#BA68C8">🌺 Bằng Lăng Rừng</option>
    <option value="🌿|#CDDC39">🌿 Cây Dầu Rái</option>
    <option value="🪴|#37474F">🪴 Cây Trầm Hương</option>
  </select>
  <button class="btn-join" onclick="connectToHost()">VÀO PHÒNG CHƠI</button>
</div>

<!-- MÀN HÌNH BẤM ĐÁP ÁN -->
<div id="playScreen">
  <div class="team-bar" id="teamDisplay"></div>
  <button id="btnX2" class="btn-x2" onclick="toggleX2()">⭐ Bật Cược x2 Điểm (1 Lần)</button>
  
  <div class="pad-grid">
    <button class="pad-btn btn-a" onclick="sendAns(0)">A</button>
    <button class="pad-btn btn-b" onclick="sendAns(1)">B</button>
    <button class="pad-btn btn-c" onclick="sendAns(2)">C</button>
    <button class="pad-btn btn-d" onclick="sendAns(3)">D</button>
  </div>
  
  <div class="status-text" id="statusMsg">Đã kết nối! Quan sát máy chiếu để chọn đáp án.</div>
</div>

<script>
  // LẤY MÃ PHÒNG TỪ ĐƯỜNG LINK DO QR CODE TẠO RA
  const urlParams = new URLSearchParams(window.location.search);
  const targetRoom = urlParams.get('room');

  const peer = new Peer();
  let conn = null;
  let isX2 = false;
  let x2Used = false;

  function connectToHost() {
    const name = document.getElementById('pName').value.trim();
    if (!name) { alert("Vui lòng nhập tên đội!"); return; }
    if (!targetRoom) { alert("Không tìm thấy mã phòng! Vui lòng quét lại mã QR trên máy chiếu."); return; }

    const [icon, color] = document.getElementById('pTree').value.split('|');

    conn = peer.connect(targetRoom);
    conn.on('open', () => {
      conn.send({ type: 'join', name: name, icon: icon, color: color });
      document.getElementById('joinCard').style.display = 'none';
      document.getElementById('playScreen').style.display = 'flex';
      document.getElementById('teamDisplay').innerHTML = `${icon} <b>${name}</b>`;
    });

    conn.on('data', (data) => {
      if (data.type === 'new_question') {
        document.getElementById('statusMsg').textContent = `Câu ${data.qIndex + 1}: Hãy bấm chọn đáp án!`;
      } else if (data.type === 'end') {
        document.getElementById('statusMsg').textContent = `Trò chơi kết thúc!`;
      }
    });
  }

  function toggleX2() {
    if (x2Used) { alert("Đã sử dụng lượt x2 trước đó!"); return; }
    isX2 = !isX2;
    const btn = document.getElementById('btnX2');
    btn.classList.toggle('active', isX2);
    btn.textContent = isX2 ? "⭐ ĐÃ BẬT CƯỢC x2!" : "⭐ Bật Cược x2 Điểm (1 Lần)";
  }

  function sendAns(choice) {
    if (!conn) return;
    const letters = ["A", "B", "C", "D"];
    conn.send({ type: 'answer', choice: choice, isX2: isX2 });
    document.getElementById('statusMsg').innerHTML = `🚀 Đã gửi đáp án <b>${letters[choice]}</b>! Đợi kết quả...`;

    if (isX2) {
      isX2 = false;
      x2Used = true;
      const btn = document.getElementById('btnX2');
      btn.disabled = true;
      btn.textContent = "Đã dùng quyền x2";
      btn.classList.remove('active');
    }
  }
</script>
</body>
 </html>
